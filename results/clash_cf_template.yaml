port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
ipv6: false

# 外部规则集（ACL4SSR）
rule-providers:
  reject:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list"
    path: ./ruleset/reject.yaml
    interval: 86400
  direct:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list"
    path: ./ruleset/direct.yaml
    interval: 86400
  proxy:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list"
    path: ./ruleset/proxy.yaml
    interval: 86400

# --- 策略组配置 ---
proxy-groups:
  # 主代理组
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - ⚖️ 负载均衡
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🇺🇸 美国节点
      - 🌐 其它地区
      - DIRECT

  # 自动优选延迟最低的节点
  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: ".*"

  # 所有节点做负载均衡
  - name: ⚖️ 负载均衡
    type: load-balance
    url: http://www.gstatic.com/generate_204
    interval: 300
    strategy: consistent-hashing
    filter: ".*"

  # --- 基于 CF IATA 机场代码的地区分组 ---
  - name: 🇭🇰 香港节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?i)HKG|HongKong|Hong Kong|香港"

  - name: 🇯🇵 日本节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?i)NRT|HND|KIX|FUK|Japan|Tokyo|Osaka|日本"

  - name: 🇸🇬 新加坡节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?i)SIN|Singapore|新加坡"

  - name: 🇺🇸 美国节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "(?i)LAX|SJC|SFO|SEA|JFK|ORD|EWR|IAD|MIA|DFW|ATL|LAS|PHX|DEN|America|United States|US|美国"

  # 兜底：既不是香港、日本、新加坡，也不是美国的节点，全扔这里
  - name: 🌐 其它地区
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: "^(?!.*(?:HKG|HongKong|香港|NRT|HND|KIX|FUK|Japan|Tokyo|Osaka|日本|SIN|Singapore|新加坡|LAX|SJC|SFO|SEA|JFK|ORD|EWR|IAD|MIA|DFW|ATL|LAS|PHX|DEN|America|United States|US|美国)).*"

  # 直连和拦截组
  - name: 🛑 全球拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择

# --- 分流规则 ---
rules:
  - RULE-SET,direct,🎯 全球直连
  - RULE-SET,reject,🛑 全球拦截
  - RULE-SET,proxy,🚀 节点选择
  - GEOIP,CN,🎯 全球直连
  - MATCH,🚀 节点选择
