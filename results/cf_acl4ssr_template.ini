[custom]

; 设置规则标志位
ruleset=🚀 节点选择,[]GEOIP,LAN
ruleset=🚀 节点选择,[]GEOIP,CN

; 针对 CF 节点的规则分流设置
; 国内直连
ruleset=🎯 全球直连,rules/LocalAreaNetwork.list
ruleset=🎯 全球直连,rules/Unban.list
ruleset=🎯 全球直连,rules/ChinaMax.list

; 拦截规则
ruleset=🛑 全球拦截,rules/BanAD.list
ruleset=🛑 全球拦截,rules/BanProgramAD.list
ruleset=🛑 全球拦截,rules/BanEasyList.list
ruleset=🛑 全球拦截,rules/BanEasyListChina.list
ruleset=🛑 全球拦截,rules/BanEasyPrivacy.list

; 代理规则
ruleset=🚀 节点选择,rules/ProxyGFWlist.list

; 默认规则
ruleset=🚀 节点选择,[]FINAL

; 定义策略组
[proxy_group]
; CF 优选节点专属：按多地区做分类，这里利用正则匹配中文地区名

; 全局主选择策略
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]⚖️ 负载均衡`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🌐 其它地区`[]🎯 全球直连

; 自动选择 - 延迟最低的 CF 节点
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

; 负载均衡 - 将所有节点均衡分发（可选轮询或散列）
custom_proxy_group=⚖️ 负载均衡`load-balance`.*`http://www.gstatic.com/generate_204`300,,50

; 各地区节点筛选（使用正则匹配，支持各种常见中文地名命名方式）
custom_proxy_group=🇭🇰 香港节点`url-test`(?i)港|hk|hongkong|hong kong`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(?i)日|jp|japan`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 新加坡节点`url-test`(?i)新|sg|singapore`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国节点`url-test`(?i)美|us|united states|america`http://www.gstatic.com/generate_204`300,,50

; 其他地区兜底（排除主流地区外的剩余 CF 节点）
custom_proxy_group=🌐 其它地区`url-test`^(?!.*(?:港|hk|hongkong|日|jp|japan|新|sg|singapore|美|us|america)).*`http://www.gstatic.com/generate_204`300,,50

; 直连策略
custom_proxy_group=🎯 全球直连`select`[]DIRECT

; 拦截策略
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT

; Rename 规则（为了让软件中节点的名称显示更友好的中文，针对 CF 常用机场/提取命名习惯处理）
rename_node=(?i)HK|HongKong|Hong Kong@🇭🇰 香港
rename_node=(?i)JP|Japan@🇯🇵 日本
rename_node=(?i)SG|Singapore@🇸🇬 新加坡
rename_node=(?i)US|America|United States@🇺🇸 美国
rename_node=(?i)TW|Taiwan@🇹🇼 台湾
rename_node=(?i)KR|Korea@🇰🇷 韩国
rename_node=(?i)UK|United Kingdom@🇬🇧 英国
rename_node=(?i)FR|France@🇫🇷 法国
rename_node=(?i)DE|Germany@🇩🇪 德国
rename_node=(?i)CF|Cloudflare@☁️ CF优选
